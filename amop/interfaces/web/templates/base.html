<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AMOP{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0; background: #0f1115; color: #e6e6e6;
    }
    header {
      padding: 1rem 1.5rem; border-bottom: 1px solid #2a2d34;
      display: flex; justify-content: space-between; align-items: center;
    }
    header a { color: #e6e6e6; text-decoration: none; font-weight: 600; }
    main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
    a { color: #6ea8fe; }
    h1 { font-size: 1.4rem; }
    .group-header {
      margin-top: 2rem; font-size: .85rem; text-transform: uppercase;
      letter-spacing: .04em; color: #9aa0aa; border-bottom: 1px solid #2a2d34;
      padding-bottom: .35rem;
    }
    .task-row {
      display: flex; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid #1c1f26;
      align-items: baseline;
    }
    .task-id { font-family: ui-monospace, "SF Mono", monospace; color: #9aa0aa; }
    .task-type { min-width: 9rem; }
    .task-desc {
      color: #c7cad1; flex: 1; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .overflow-note { color: #6b7280; font-size: .85rem; padding: .4rem 0; }
    pre {
      background: #14161b; border: 1px solid #2a2d34; border-radius: 6px;
      padding: 1rem; overflow-x: auto; white-space: pre; font-size: .85rem;
    }
    .meta-table { border-collapse: collapse; margin-bottom: 1.5rem; }
    .meta-table td { padding: .25rem .75rem .25rem 0; vertical-align: top; }
    .meta-table td:first-child { color: #9aa0aa; }
    form.login-form {
      max-width: 320px; margin: 4rem auto; display: flex; flex-direction: column;
      gap: .75rem;
    }
    input[type=password] {
      padding: .5rem; background: #1c1f26; border: 1px solid #2a2d34;
      color: #e6e6e6; border-radius: 4px; font-size: 1rem;
    }
    button {
      padding: .5rem 1rem; background: #2563eb; border: none; color: white;
      border-radius: 4px; cursor: pointer; font-size: 1rem;
    }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <a href="/web/tasks">AMOP</a>
    {% if show_logout %}<a href="/web/logout">Log out</a>{% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
