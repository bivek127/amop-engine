<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AMOP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0A0B0E;
      --surface: #15161B;
      --surface-2: #1B1D24;
      --border: #24262E;
      --text: #E8E9ED;
      --text-muted: #8B8D98;
      --text-faint: #5C5E68;
      --accent: #2DD4BF;
      --accent-dim: #1A3A37;

      --amber: #F5A623;
      --amber-dim: #3A2E14;
      --red: #F0525A;
      --red-dim: #3A1A1D;
      --green: #3DD68C;
      --green-dim: #123326;
      --blue: #5B9DF0;
      --blue-dim: #172A42;
      --gray: #7C7E88;
      --gray-dim: #26272E;

      --font-ui: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
      display: flex;
    }
    a { color: inherit; text-decoration: none; }

    /* -- sidebar -------------------------------------------------- */
    .sidebar {
      width: 220px; flex: none; min-height: 100vh;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 1.25rem 1rem;
    }
    .wordmark {
      display: flex; align-items: center; gap: .5rem;
      font-weight: 800; font-size: 1.05rem; letter-spacing: .01em;
      padding: .25rem .5rem 1.5rem;
    }
    .wordmark .dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .nav { display: flex; flex-direction: column; gap: .2rem; }
    .nav a {
      padding: .5rem .6rem; border-radius: 7px; font-size: .9rem; font-weight: 600;
      color: var(--text-muted); display: flex; align-items: center; gap: .55rem;
    }
    .nav a:hover { background: var(--surface); color: var(--text); }
    .nav a.active { background: var(--surface-2); color: var(--text); }
    .nav a .icon { width: 16px; text-align: center; opacity: .85; }
    .sidebar-footer {
      margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border);
    }
    .sidebar-footer a {
      font-size: .82rem; color: var(--text-faint); padding: .4rem .6rem; display: block;
    }
    .sidebar-footer a:hover { color: var(--text-muted); }

    /* -- main ------------------------------------------------------ */
    main { flex: 1; min-width: 0; padding: 2rem 2.5rem; max-width: 1180px; }
    h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 .3rem; letter-spacing: -.01em; }
    .page-sub { color: var(--text-muted); font-size: .92rem; margin: 0 0 1.75rem; }

    /* -- shared bits ------------------------------------------------ */
    .mono { font-family: var(--font-mono); }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .18rem .55rem; border-radius: 20px;
      font-size: .74rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
      white-space: nowrap;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .badge.amber { background: var(--amber-dim); color: var(--amber); }
    .badge.amber .dot { background: var(--amber); }
    .badge.red { background: var(--red-dim); color: var(--red); }
    .badge.red .dot { background: var(--red); }
    .badge.green { background: var(--green-dim); color: var(--green); }
    .badge.green .dot { background: var(--green); }
    .badge.blue { background: var(--blue-dim); color: var(--blue); }
    .badge.blue .dot { background: var(--blue); }
    .badge.gray { background: var(--gray-dim); color: var(--gray); }
    .badge.gray .dot { background: var(--gray); }

    pre {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem; overflow-x: auto; white-space: pre; font-size: .82rem;
      font-family: var(--font-mono);
    }

    form.login-form {
      max-width: 320px; margin: 4rem auto; display: flex; flex-direction: column;
      gap: .75rem;
    }
    input, select, textarea {
      font-family: var(--font-ui); font-size: .92rem;
      padding: .55rem .7rem; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 7px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
    }
    button, .btn {
      font-family: var(--font-ui); font-weight: 700; font-size: .88rem;
      padding: .55rem 1rem; background: var(--accent); border: none; color: #06231F;
      border-radius: 7px; cursor: pointer;
    }
    button:hover, .btn:hover { filter: brightness(1.08); }
    button.secondary, .btn.secondary {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    }
    .error { color: var(--red); font-size: .88rem; }

    ::selection { background: var(--accent-dim); color: var(--text); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% if show_logout %}
  <nav class="sidebar">
    <div class="wordmark"><span class="dot"></span> AMOP</div>
    <div class="nav">
      <a href="/web/tasks" class="{{ 'active' if request.url.path.startswith('/web/tasks') else '' }}">
        <span class="icon">&#9673;</span> Tasks
      </a>
      <a href="/web/submit" class="{{ 'active' if request.url.path == '/web/submit' else '' }}">
        <span class="icon">&#43;</span> Submit a bug
      </a>
    </div>
    <div class="sidebar-footer">
      <a href="/web/logout">Log out</a>
    </div>
  </nav>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
