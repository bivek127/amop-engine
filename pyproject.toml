[project]
name = "amop"
version = "0.0.1"
description = "AMOP — Autonomous Multi-Agent Operations Platform"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic",
    "click",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "python-dotenv",
    "docker",
    "pgvector",
    "pathspec",
    "PyGithub>=2.1,<3",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "itsdangerous",
    "python-telegram-bot[job-queue]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/fixtures/ holds seeded-buggy repos (Section 19.3) whose suites are
# SUPPOSED to fail -- they're inputs to the agent chain, not part of AMOP's
# own suite. Without this they'd get collected and report 2 permanent
# failures. Defaults are restated because setting this key replaces them.
norecursedirs = ["fixtures", "*.egg", ".*", "build", "dist", "node_modules", "venv"]
